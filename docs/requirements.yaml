invariants:
  - id: INV-01
    name: Immutability of a submitted revision
    canon_ref: canon 4.4, 5.1
    rule: >-
      A submitted decision_revision cannot be updated, deleted or truncated. Enforced by
      BEFORE UPDATE OR DELETE triggers, a BEFORE TRUNCATE FOR EACH STATEMENT trigger
      (V15), and absent UPDATE/DELETE/TRUNCATE grants.
    tag: inv:INV-01
    required_control: >-
      Paired positive control - the same transaction must succeed in appending a new
      revision, so the failure is shown to be the mutation and not the fixture.
    covers: [FR-04]
    covering_tests:
      - tests/integration/decision/submit.test.ts
      - tests/integration/audit/immutability.test.ts
    status: PLANNED

  - id: INV-02
    name: Double-submit idempotency
    canon_ref: canon 4.4, 5.1; master prompt 6
    rule: >-
      Two concurrent submissions of the same revision produce one row, not two, keyed on
      decision_revision.idempotency_token (unique) and unique (decision_id, revision_no).
      The arbitration is an explicit select for update on the parent decision row; the
      unique constraint is the backstop, not the mechanism. The row-count assertion that
      makes a zero-row write loud is INV-11.
    tag: inv:INV-02
    required_control: >-
      Genuinely concurrent - two clients, explicit BEGIN, interleaved statements, an
      xact_start overlap assertion and an application rendezvous. Lock-wait detection is
      not a valid negative control (V23); waitUntilBlocked must be shown to return false
      on different rows (INS-01).
    covers: [FR-04]
    covering_tests:
      - tests/integration/decision/double-submit.test.ts
      - tests/integration/decision/append-revision.test.ts
    status: PLANNED

  - id: INV-03
    name: Illegal transition rejection
    canon_ref: canon 4.4 (V28, V29)
    rule: >-
      state is GENERATED ALWAYS AS STORED from the five milestone timestamps by the
      IMMUTABLE function app.derive_decision_state, with per-branch enum casts and never a
      cast of the CASE result (V12). The BEFORE UPDATE trigger derives the PROSPECTIVE
      state by calling that same function on NEW's milestone timestamps, compares
      OLD.state to the prospective state against a whitelist, and raises uppercase custom
      SQLSTATEs (V13) that the API maps to distinct HTTP statuses. The trigger must NEVER
      read NEW.state - it is NULL in a BEFORE UPDATE trigger on a generated column (V28,
      reproduced on this cluster), so a trigger that reads it compares against NULL on
      every transition and therefore permits everything or rejects everything. One
      function definition serves both the column and the guard, so they cannot drift
      (V29). RLS never encodes transitions (V7).
    tag: inv:INV-03
    required_control: >-
      A meta-test over all 32 combinations of the five milestone timestamps being null or
      non-null, asserting that the function's result and the stored column agree for every
      combination - this is what fails against a trigger that reads NEW.state, because
      every comparison sees NULL. Plus: each rejected pair is paired with the legal
      transition out of the same state, and every custom SQLSTATE is round-trip tested for
      case (V13 - a lowercase SQLSTATE silently resolves to 42704).
    covers: [FR-04]
    covering_tests:
      - tests/integration/decision/state.test.ts
    status: PLANNED

  - id: INV-04
    name: Cross-user denial with positive control
    canon_ref: canon 8.2
    rule: >-
      A sees the row (1), B sees 0, B's write raises nothing, A still sees 1. Inside a
      rolled-back transaction the policy is dropped and the row must become visible.
    tag: inv:INV-04
    required_control: >-
      The policy-drop probe is the control. A bare rowCount === 0 proves nothing, because
      DELETE 0 under RLS is byte-identical to deleting a nonexistent id (V19) and a
      failing USING clause raises nothing (V7). Every denial case asserts the after-state
      read, not only the row count.
    covers: [FR-14, FR-19, NFR-01]
    covering_tests:
      - tests/integration/db/cross-user-denial.test.ts
      - tests/adversarial/idor.test.ts
    status: PLANNED

  - id: INV-05
    name: Missing-context validation
    canon_ref: canon 4.3, 6.1
    rule: >-
      app.require_user_id() raises SQLSTATE 28000 when app.current_user_id is NULL or the
      empty string (V5), and withUser calls it eagerly after set_config so a missing
      context fails loudly regardless of query shape (V6).
    tag: inv:INV-05
    required_control: >-
      Negative control - the same query with context set must return the row, and the
      no-context case must raise rather than return zero rows.
    covers: [FR-14, NFR-01]
    covering_tests:
      - tests/integration/db/context.test.ts
      - tests/integration/db/eager-validation.test.ts
    status: PLANNED

  - id: INV-06
    name: Pooled-identity leak across sequential requests
    canon_ref: canon 7.6, 6.1
    rule: >-
      Two sequential requests on one warmed pooled client must not let the first
      request's identity reach the second. DISCARD ALL in the finally block makes a
      mistaken is_local=false inert; app.require_user_id() stays STABLE, because an
      IMMUTABLE variant was proven to leak one user's rows to another from the second
      execution of a prepared statement onward.
    tag: inv:INV-06
    required_control: >-
      Catalog assertion provolatile = 's' as the primary gate (it cannot be scheduled
      away), plus a two-request sequence on a single client asserting the second
      request's rows belong to the second user only.
    covers: [FR-14, NFR-01]
    covering_tests:
      - tests/adversarial/pooled-identity.test.ts
      - tests/integration/db/discard-all.test.ts
    status: PLANNED

  - id: INV-07
    name: Scenario-version pinning
    canon_ref: canon 5.1, 7.2, 7.3
    rule: >-
      decision_revision pins scenario_version_id by composite FK, scenario_version is
      immutable once published_at is set, and every challenge or assessment record names
      the exact revision and scenario version evaluated.
    tag: inv:INV-07
    required_control: >-
      Publish a later scenario_version and assert the submitted decision's trail still
      resolves the pinned version, with a positive control that the new version is
      otherwise reachable.
    covers: [FR-02, FR-15]
    covering_tests:
      - tests/integration/history/view-posture.test.ts
      - tests/integration/content/read-only.test.ts
    status: PLANNED

  - id: INV-08
    name: AI never awards maturity level 3 or 4
    canon_ref: canon 5.1, 1.2; PRD 7.2
    rule: >-
      check (assessor_kind <> 'ai' or observed_level <= 2) keeps the full 0-4 domain in
      the database while constraining the AI, and a trigger forbids any AI-path update of
      a human_reviewer row.
    tag: inv:INV-08
    required_control: >-
      Positive control - the same insert with assessor_kind = 'human_reviewer' and
      observed_level 3 must succeed, so the rejection is attributable to the assessor
      kind.
    covers: [FR-10]
    covering_tests:
      - tests/integration/assessment/ai-ceiling.test.ts
    status: PLANNED

  - id: INV-09
    name: Citation whitelist
    canon_ref: canon 5.1, 7.3
    rule: >-
      Every evidence_ref and source_claim is checked against scenario_claim for the
      pinned scenario_version_id, and the citation row carries a composite FK over
      (scenario_version_id, source_id, claim_id) plus the owning challenge's (id,
      user_id), so a fabricated citation cannot be persisted. A challenge whose citations
      do not all resolve is dropped individually and the drop is recorded with a
      failure_code. The same chain exists for assessment_observation_source_claim.
    tag: inv:INV-09
    required_control: >-
      Positive control - an approved claim id from the same scenario_version must
      persist, and the unapproved id must be rejected at the database layer with the
      application check disabled, so the FK is shown to be load-bearing.
    covers: [FR-08, FR-02]
    covering_tests:
      - tests/integration/ai/grounding.test.ts
      - tests/integration/assessment/observation-grounding.test.ts
    status: PLANNED

  - id: INV-10
    name: Backfill bracketing in one migration file
    canon_ref: canon 4.4, 10 (V8)
    rule: >-
      FORCE ROW LEVEL SECURITY makes an owner-run UPDATE WHERE true affect zero rows and
      raise nothing, and SET row_security = off is refused (V8). Every data migration
      therefore brackets alter table no force and alter table force in the SAME migration
      file, and the migration lint rejects an unmatched no force. A migration that leaves
      a table NO FORCE is the posture regression the lint exists to catch.
    tag: inv:INV-10
    required_control: >-
      A planted fixture containing an unmatched no force must be REPORTED by the lint; a
      correctly bracketed fixture must not be. A lint that reports neither has not been
      shown to read the file.
    covers: [FR-19, NFR-01]
    covering_tests:
      - tests/unit/tooling/migration-lint.test.ts
    status: PLANNED

  - id: INV-11
    name: Row-count assertion on every privileged write
    canon_ref: canon 4.4 (V7)
    rule: >-
      EVERY privileged write asserts its own row count - get diagnostics n = row_count;
      if n <> 1 then raise using errcode = 'ST005' - because a failing RLS USING clause
      affects zero rows and raises nothing (V7), so silence is never success and a row
      count of 0 never distinguishes denial from absence. This applies to the submission
      path, the state-transition path and the erasure path alike, not to submission only.
    tag: inv:INV-11
    required_control: >-
      A test double that zeroes the row count must cause a raise, asserted separately on
      the submission, transition and erasure paths. A write path with no such assertion
      is a gap even when its happy-path test passes.
    covers: [FR-04, FR-16, NFR-03]
    covering_tests:
      - tests/integration/decision/submit.test.ts
      - tests/integration/decision/state.test.ts
      - tests/integration/deletion/erase-self.test.ts
    status: PLANNED

instruments:
  - id: INS-01
    name: waitUntilBlocked reports the negative
    canon_ref: canon 8.4
    rule: >-
      waitUntilBlocked must return false when two sessions lock different rows.
      Harness-fatal.
    tag: inv:INS-01
    covering_tests:
      - tests/integration/harness/instruments.test.ts
    status: PLANNED
  - id: INS-02
    name: Revision-number helper reports a difference
    canon_ref: canon 8.4
    rule: >-
      The revision-number read helper, run sequentially, must produce different values.
      Harness-fatal.
    tag: inv:INS-02
    covering_tests:
      - tests/integration/harness/instruments.test.ts
    status: PLANNED
  - id: INS-03
    name: a11y and overflow canary
    canon_ref: canon 8.5
    rule: >-
      The axe gate and the 320px overflow detector must both fail on /__a11y-canary,
      which is mounted only under E2E_FAULTS=1.
    tag: inv:INS-03
    covering_tests:
      - tests/e2e/canary.spec.ts
    status: PLANNED
  - id: INS-04
    name: Sentinel check in both directions
    canon_ref: canon 8.1
    rule: >-
      With no context every protected table returns 0; as the sentinel user each returns
      exactly 1. A table shipped without RLS leaks its sentinel and the run dies.
    tag: inv:INS-04
    covering_tests:
      - tests/integration/db/sentinels.test.ts
      - tests/integration/harness/app-role.test.ts
    status: PLANNED
  - id: INS-05
    name: Observability positive control
    canon_ref: canon 8.4
    rule: >-
      A positive observability assertion must distinguish a NULLed pg_stat_activity
      (V24) from "not yet blocked".
    tag: inv:INS-05
    covering_tests:
      - tests/integration/harness/instruments.test.ts
    status: PLANNED
  - id: INS-06
    name: gates:selftest deep equality
    canon_ref: canon 8.6
    rule: >-
      gates:selftest fixtures assert deep equality against an expected per-requirement
      object, not an exit code - five fixtures asserting only code === 2 let a checker
      that returns 0 or 2 pass seven of ten. trace:check is the separate script that
      diffs only the deterministic committed document; the deep-equality fixtures do not
      belong to it.
    tag: inv:INS-06
    covering_tests:
      - tests/unit/tooling/trace-check.test.ts
      - tests/unit/tooling/tags-reporter.test.ts
    status: PLANNED
  - id: INS-07
    name: Test-isolation doctrine
    canon_ref: canon 8.3
    rule: >-
      Per-worker CREATE DATABASE TEMPLATE statesman_test_template, dropped at teardown -
      never TRUNCATE, which the immutability triggers forbid by design. Migrations are
      applied by lexical glob so a new migration cannot be omitted from the test path.
      Tests connect as statesman_app and a wrong-role connection is HARNESS-FATAL, not a
      warning. Seeding goes through withUser so a missing INSERT policy surfaces instead
      of being bypassed. withUser contains no rollback branch and no process.env
      reference; per-test transaction isolation is injected by test-only code through an
      optional provider.
    tag: inv:INS-07
    required_control: >-
      Point the fixture at a statesman_migrator connection string and assert the harness
      ABORTS - it fails while the harness merely logs. Separately assert that the compiled
      source of withUser contains no process.env and no env-gated rollback path.
    covers_canon: canon 8.3
    covering_tests:
      - tests/integration/harness/app-role.test.ts
      - tests/unit/db/with-user.test.ts
    status: PLANNED
  - id: INS-08
    name: Focus indication asserted as a difference
    canon_ref: canon 8.5
    rule: >-
      Focus visibility is asserted as a DIFFERENCE between focused and blurred computed
      styles plus a contrast ratio of at least 3:1. A presence check on outlineStyle can
      never fail, because UA stylesheets give :focus-visible elements outline-style: auto
      regardless of the author's CSS.
    tag: inv:INS-08
    required_control: >-
      A fixture with the author focus styling removed must FAIL the difference assertion
      while still reporting outline-style: auto. A gate that passes on that fixture is
      measuring the UA stylesheet.
    covering_tests:
      - tests/e2e/focus.spec.ts
    status: PLANNED

