# STATESMAN OS - machine-readable requirement register.
#
# This file is the single source of requirement, invariant and instrument ids
# (canon section 12). docs/requirements-traceability.md is a deterministic render of
# this file: edit here first, re-render, and commit both in the same change.
# Per the amended canon section 8.6 neither file may contain a timestamp, a generation
# date or a per-run verification outcome. A design status from {PLANNED, DEFERRED} is
# permitted and is required by master prompt section 3 item 2; a run status
# (PASS / FAIL / NOT RUN) is not representable in either file.
#
# Canon:  docs/superpowers/specs/2026-10-20-statesman-os-p0-mvp-design.md (SOS-DESIGN-001)
# PRD:    docs/PRD.md (SOS-PRD-001 v1.0)
# Prompt: docs/MASTER_PROMPT.md section 3 item 2
# Layout: docs/implementation-plan.md owns migration filenames and the source/test layout.
#         Every implementation_path and covering_test below is a file that one of its
#         tasks creates. A path here that no task creates is a defect (canon section 12).

meta:
  id: SOS-TRACE-001
  canon: SOS-DESIGN-001
  prd: SOS-PRD-001 v1.0
  implementation_state: no application code exists; nothing in this register has been executed
  status_vocabulary: [PLANNED, DEFERRED]
  status_is: a design property of scope, stable between runs
  run_outcome_vocabulary: [PASS, FAIL, NOT RUN]
  run_outcome_lives_in: reports/trace.json
  verification_vocabulary: [unit, integration, e2e, posture-check, manual, deferred]
  file_layout_of_record: docs/implementation-plan.md
  decisions_record: docs/decisions.md
  manual_leg_rule: >-
    Canon section 12.3 - a verification method that includes "manual" names a
    verification_evidence record. Until that record exists and is referenced, the
    requirement reaches at most NOT RUN in reports/trace.json, and docs:check asserts that
    every row whose verification includes "manual" names its record. No sign-off name and
    no date is recorded for a review that has not happened.
  nfr_priority_note: >-
    PRD section 6.4 assigns priorities to FRs only. PRD section 11 states NFR release
    targets without priorities, and the canon does not assign them either. NFR priority
    below is recorded as "P0 (inferred)" on the basis of PRD section 11 and the
    master prompt go/no-go conditions; it is an inference, not a PRD statement.

# How docs/requirements-traceability.md is produced from this file. These rules are the
# render contract: applying them twice to the same content yields the same bytes.
render:
  target: docs/requirements-traceability.md
  rules:
    - acceptance, component and rule strings are copied verbatim and carry no trailing period
    - prd_ref "PRD 6.1" renders as "section 6.1" in prose and "§6.1" in a table cell
    - an empty list renders as an em dash
    - a path, table or identifier renders in backticks, comma-separated, in list order
    - a status cell carries only the status token; deferral gates render in their own table
    - counts in the header are derived from this file, never typed

# Entity groups referenced as $name in db_entities. Taken from canon section 5.
entity_groups:
  reference:
    - scenario
    - scenario_version
    - source
    - scenario_claim
    - rubric_version
    - schema_migrations
  user_owned:
    - decision
    - decision_revision
    - challenge_run
    - challenge
    - challenge_source_claim
    - challenge_response
    - dimension_assessment
    - assessment_observation
    - assessment_observation_source_claim
    - reflection
    - development_action
    - audit_event
  grant_protected:
    - app_user
    - user_session
    - auth_attempt

