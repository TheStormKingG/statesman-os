      the expected outcome or the timeframe is rejected by the schema and not only by the
      form. PRD 7.4 keeps forecast, confidence, deadline and later observation separate.
      The unit leg is the confidence-bound check of master prompt section 9; no unit
      test is listed in this row's covering_tests, so that leg is uncovered and the
      database assertion is the only one this register carries.

