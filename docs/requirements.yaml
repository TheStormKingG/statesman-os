    status: PLANNED
    notes: >-
      Canon 5.1 grants UPDATE on draft_payload only; draft_updated_at is trigger-set so a
      payload-only update cannot evade the frozen-draft check. A partial unique index
      enforces one open draft per user per scenario version. The unit leg is field
      validation (master prompt section 9); no unit test is listed in this row's
      covering_tests, so that leg is uncovered and the database constraints of the
      submission path are an independent backstop rather than a substitute for it.

